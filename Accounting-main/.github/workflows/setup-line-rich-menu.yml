name: Setup LINE Rich Menu

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-rich-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify repository files
        shell: bash
        run: |
          pwd
          ls -la

          if [ ! -f "requirements.txt" ]; then
            echo "::error::ไม่พบ requirements.txt ที่ราก Repository"
            exit 1
          fi

          if [ ! -f "scripts/setup_line_rich_menu.py" ]; then
            echo "::error::ไม่พบ scripts/setup_line_rich_menu.py"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create and activate LINE Rich Menu
        env:
          PYTHONPATH: ${{ github.workspace }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: python scripts/setup_line_rich_menu.py
